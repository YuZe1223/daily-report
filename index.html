<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音直播带货 · 爆款榜日报</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; background: #0f0f1a; color: #e0e0e0; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
.header { text-align: center; padding: 30px 20px; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); border-radius: 16px; margin-bottom: 24px; }
.header h1 { font-size: 28px; color: #ffd700; margin-bottom: 8px; }
.header .sub { color: #889; font-size: 14px; }
.header .date { color: #ff6b6b; font-size: 16px; margin-top: 6px; }
.date-nav { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 24px; }
.date-nav button { background: #1a1a2e; color: #ffd700; border: 1px solid #ffd700; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
.date-nav button:hover { background: rgba(255,215,0,0.15); }
.date-nav button:disabled { color: #555; border-color: #444; cursor: not-allowed; }
.date-nav .current-date { font-size: 18px; font-weight: bold; color: #fff; min-width: 120px; text-align: center; }
.date-nav input[type="date"] { background: #1a1a2e; color: #fff; border: 1px solid #2a2a4a; padding: 6px 12px; border-radius: 8px; font-size: 14px; }
.date-nav input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: #1a1a2e; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #2a2a4a; }
.stat-card .value { font-size: 32px; font-weight: bold; color: #ffd700; }
.stat-card .label { font-size: 13px; color: #889; margin-top: 4px; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0; }
.chart-box { background: #1a1a2e; border-radius: 12px; padding: 20px; border: 1px solid #2a2a4a; }
.chart-box h3 { color: #ffd700; font-size: 15px; margin-bottom: 16px; }
.chart-box canvas { max-height: 300px; }
.section-title { font-size: 20px; color: #ffd700; margin: 24px 0 16px; padding-left: 12px; border-left: 3px solid #ffd700; }
.table-wrap { background: #1a1a2e; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a4a; }
table { width: 100%; border-collapse: collapse; }
thead th { background: #16213e; color: #ffd700; padding: 12px 16px; text-align: left; font-size: 13px; }
tbody td { padding: 10px 16px; font-size: 13px; border-bottom: 1px solid #2a2a4a; }
tbody tr:hover { background: rgba(255,215,0,0.05); }
tbody tr:hover .product-link { color: #ffd700; }
.rank { font-weight: bold; font-size: 16px; text-align: center; width: 50px; }
.rank-1 { color: #ffd700; } .rank-2 { color: #c0c0c0; } .rank-3 { color: #cd7f32; }
.product-link { color: #4ecdc4; text-decoration: none; display: block; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.2s; }
.product-link:hover { color: #ffd700; text-decoration: underline; }
.shop-name { font-size: 11px; color: #666; margin-top: 2px; }
.unit-price { font-size: 11px; color: #ffd700; margin-top: 1px; }
.sales { font-weight: bold; color: #ff6b6b; }
.commission { color: #4ecdc4; font-weight: bold; }
.commission-high { color: #ffd700; }
.no-data { text-align: center; padding: 60px; color: #555; font-size: 16px; }
.footer { text-align: center; padding: 20px; color: #555; font-size: 12px; }
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>📊 抖音直播带货 · 爆款榜日报</h1>
  <div class="date" id="dateDisplay">--</div>
  <div class="sub">数据来源：巨量百应 · 爆款榜（昨日 / 直播） | 自动化采集</div>
</div>

<div class="date-nav">
  <button onclick="changeDate(-1)" id="btnPrev">◀ 前一天</button>
  <span class="current-date" id="currentDate">--</span>
  <input type="date" id="datePicker" onchange="jumpToDate(this.value)">
  <button onclick="changeDate(1)" id="btnNext">后一天 ▶</button>
</div>

<div class="stats-row">
  <div class="stat-card"><div class="value" id="totalSales">--</div><div class="label">昨日总销量</div></div>
  <div class="stat-card"><div class="value" id="avgCommission">--</div><div class="label">平均佣金率</div></div>
  <div class="stat-card"><div class="value" id="maxEarn">--</div><div class="label">最高佣金 (¥/单)</div></div>
  <div class="stat-card"><div class="value" id="topProduct">--</div><div class="label">销量冠军</div></div>
</div>

<div class="charts-row">
  <div class="chart-box"><h3>📈 Top 10 昨日销量</h3><canvas id="salesChart"></canvas></div>
  <div class="chart-box"><h3>💰 佣金率对比 (%)</h3><canvas id="commissionChart"></canvas></div>
</div>

<h2 class="section-title">🏆 完整榜单 Top 20</h2>
<div class="table-wrap">
<table><thead><tr><th style="width:50px">排名</th><th>商品名称 / 店铺</th><th style="width:100px">昨日销量</th><th style="width:130px">佣金</th></tr></thead>
<tbody id="tableBody"></tbody></table>
</div>

<div class="footer">点击商品名称跳转详情页 | 数据来源: 巨量百应</div>
</div>

<script>
var allDates = {};
var availableDates = [];
var currentIndex = 0;
var salesChart = null;
var commissionChart = null;

function parseSalesInt(s) { return parseInt(String(s||'0').replace('万','0000')) || 0; }

function loadDateList() {
  fetch('data/all.json').then(function(r){return r.json()}).then(function(all) {
    allDates = all;
    availableDates = Object.keys(all).sort();
    if (availableDates.length > 0) {
      currentIndex = availableDates.length - 1;
      renderDate(availableDates[currentIndex]);
    }
    updateNavButtons();
  }).catch(function() {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" class="no-data">数据加载失败</td></tr>';
  });
}

function updateNavButtons() {
  document.getElementById('btnPrev').disabled = currentIndex <= 0;
  document.getElementById('btnNext').disabled = currentIndex >= availableDates.length - 1;
  if (availableDates.length > 0) {
    document.getElementById('datePicker').value = availableDates[currentIndex];
  }
}

function changeDate(delta) {
  var idx = currentIndex + delta;
  if (idx >= 0 && idx < availableDates.length) {
    currentIndex = idx;
    renderDate(availableDates[currentIndex]);
    updateNavButtons();
  }
}

function jumpToDate(dateStr) {
  var idx = availableDates.indexOf(dateStr);
  if (idx >= 0) { currentIndex = idx; renderDate(dateStr); updateNavButtons(); }
  else { alert('该日期暂无数据'); }
}

function renderDate(dateStr) {
  var rec = allDates[dateStr];
  if (!rec) return;
  var data = rec.products || [];
  document.getElementById('dateDisplay').textContent = rec.title || dateStr;
  document.getElementById('currentDate').textContent = dateStr;

  var totalSales = data.reduce(function(s,i){return s+parseSalesInt(i.sales)},0);
  var avgRate = (data.reduce(function(s,i){return s+(i.cos_ratio||0)},0) / Math.max(data.length,1)).toFixed(1);
  var maxEarn = (Math.max.apply(null, data.map(function(i){return (i.cos_fee||0)/100}))).toFixed(2);
  var topTitle = data.length > 0 ? data[0].title.substring(0,16)+'...' : '--';

  document.getElementById('totalSales').textContent = totalSales >= 10000 ? Math.floor(totalSales/10000)+'万' : String(totalSales);
  document.getElementById('avgCommission').textContent = avgRate+'%';
  document.getElementById('maxEarn').textContent = '¥'+maxEarn;
  document.getElementById('topProduct').textContent = topTitle;

  var tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  data.forEach(function(item, i) {
    var tr = document.createElement('tr');
    var rankClass = i < 3 ? ' rank-'+(i+1) : '';
    var commClass = (item.cos_ratio||0) >= 20 ? ' commission-high' : '';
    var salesNum = parseSalesInt(item.sales);
    var salesDisplay = salesNum >= 10000 ? Math.floor(salesNum/10000)+'万' : String(salesNum);
    tr.innerHTML =
      '<td class="rank'+rankClass+'">'+(i+1)+'</td>'+
      '<td>'+
        '<a class="product-link" href="'+item.detail_url+'" target="_blank" title="点击跳转商品详情">'+item.title+'</a>'+
        '<div class="shop-name">'+item.shop_name+'</div>'+
        '<div class="unit-price">客单价 ¥'+(item.unit_price||0).toFixed(2)+'</div>'+
      '</td>'+
      '<td class="sales">'+salesDisplay+'</td>'+
      '<td class="commission'+commClass+'">'+(item.commission||(item.cos_ratio+'%赚¥'+((item.cos_fee||0)/100).toFixed(2)))+'</td>';
    tbody.appendChild(tr);
  });

  var top10 = data.slice(0,10);
  if (salesChart) salesChart.destroy();
  if (commissionChart) commissionChart.destroy();

  salesChart = new Chart(document.getElementById('salesChart').getContext('2d'), {
    type: 'bar',
    data: {
      labels: top10.map(function(_,i){return '#'+(i+1)}),
      datasets: [{data: top10.map(function(i){return parseSalesInt(i.sales)/10000}), backgroundColor: top10.map(function(_,i){return i<3?'rgba(255,215,0,0.8)':'rgba(78,205,196,0.5)'}), borderColor: top10.map(function(_,i){return i<3?'#ffd700':'#4ecdc4'}), borderWidth:1, borderRadius:4}]
    },
    options: {responsive:true, plugins:{legend:{display:false}}, scales:{y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#889'}},x:{ticks:{color:'#889'}}}}
  });
  commissionChart = new Chart(document.getElementById('commissionChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: top10.map(function(_,i){return '#'+(i+1)}),
      datasets: [{data: top10.map(function(i){return i.cos_ratio||0}), borderColor:'#ff6b6b', backgroundColor:'rgba(255,107,107,0.1)', fill:true, tension:0.4, pointBackgroundColor:'#ff6b6b', pointRadius:5}]
    },
    options: {responsive:true, plugins:{legend:{display:false}}, scales:{y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#889', callback:function(v){return v+'%'}}},x:{ticks:{color:'#889'}}}}
  });
}

loadDateList();
</script>
</body>
</html>
