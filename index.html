<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>抖音直播带货 · 爆款榜日报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js'"></script>
<style>
:root {
  --primary: #00bcd4;
  --primary-deep: #0097a7;
  --sunshine-300: #4dd0e1;
  --sunshine-500: #00bcd4;
  --sunshine-700: #0097a7;
  --sunshine-900: #006064;
  --yellow-saturated: #18ffff;
  --cream: #1a1a28;
  --cream-soft: #222236;
  --cream-deeper: #2a2a3e;
  --beige-deep: #333350;
  --ink: #e8e8f0;
  --ink-tint: #b0b0c0;
  --charcoal: #d0d0d8;
  --slate: #9090a8;
  --steel: #787898;
  --stone: #606078;
  --muted: #505068;
  --hairline: #2a2a3e;
  --hairline-soft: #222236;
  --hairline-strong: #3a3a50;
  --canvas: #0d0d14;
  --surface: #12121e;
  --on-primary: #ffffff;
  --on-dark: #ffffff;
  --on-dark-muted: #787898;
  --on-cream: #e8e8f0;
  --link: #00bcd4;
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 20px;
  --spacing-xl: 24px;
  --spacing-xxl: 32px;
  --spacing-xxxl: 40px;
  --spacing-section: 64px;
  --rounded-md: 8px;
  --rounded-lg: 12px;
  --rounded-xl: 16px;
  --rounded-full: 9999px;
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--canvas);color:var(--ink);overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.container{max-width:1120px;margin:0 auto;padding:0 var(--spacing-md)}

/* ── Hero band ── */
.hero-band{background:linear-gradient(160deg,var(--sunshine-500) 0%,var(--sunshine-700) 35%,var(--sunshine-900) 65%,var(--primary) 100%);padding:var(--spacing-xxxl) var(--spacing-md) var(--spacing-xxl);text-align:center;margin-bottom:var(--spacing-xxl);position:relative;overflow:hidden}
.hero-band::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--sunshine-700),var(--yellow-saturated),var(--cream))}
.hero-band h1{font-size:clamp(28px,5vw,48px);font-weight:700;color:#fff;letter-spacing:-0.5px;margin-bottom:var(--spacing-xs);line-height:1.15;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.hero-band .date{font-size:15px;color:rgba(255,255,255,.8);font-weight:500}
.hero-band .sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px}

/* ── Date nav ── */
.date-nav{display:flex;justify-content:center;align-items:center;gap:var(--spacing-sm);margin-bottom:var(--spacing-xxl);flex-wrap:wrap}
.date-nav button{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;padding:10px 20px;border-radius:var(--rounded-md);cursor:pointer;transition:all .15s;min-height:44px;line-height:1.3;background:var(--canvas);color:var(--ink);border:1px solid var(--hairline-strong)}
.date-nav button:active{background:var(--surface)}
.date-nav button:disabled{color:var(--muted);border-color:var(--hairline);cursor:not-allowed;opacity:.5}
.date-nav .current-date{font-size:17px;font-weight:600;color:var(--ink);min-width:120px;text-align:center}
.date-nav input[type=date]{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;padding:10px 16px;border-radius:var(--rounded-md);border:1px solid var(--hairline-strong);background:var(--canvas);color:var(--ink);min-height:44px;line-height:1.3}
.date-nav input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer}

/* ── Stats row ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--spacing-md);margin-bottom:var(--spacing-xxl)}
.stat-card{background:var(--cream);border-radius:var(--rounded-lg);padding:var(--spacing-xl);text-align:center;border:1px solid var(--beige-deep)}
.stat-card .value{font-size:clamp(24px,4vw,36px);font-weight:700;color:var(--primary);line-height:1.2;margin-bottom:4px}
.stat-card .label{font-size:12px;font-weight:500;color:var(--steel);text-transform:uppercase;letter-spacing:.5px}

/* ── Charts ── */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-md);margin-bottom:var(--spacing-xxl)}
.chart-box{background:var(--canvas);border-radius:var(--rounded-lg);padding:var(--spacing-xl);border:1px solid var(--hairline-soft)}
.chart-box h3{font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:var(--spacing-md);padding-left:var(--spacing-sm);border-left:3px solid var(--primary)}
.chart-box canvas{max-height:260px}

/* ── Section title ── */
.section-title{font-size:clamp(18px,3vw,22px);font-weight:600;color:var(--ink);margin:var(--spacing-xxl) 0 var(--spacing-lg);padding-left:var(--spacing-sm);border-left:4px solid var(--primary);letter-spacing:-.3px}

/* ── Table ── */
.table-wrap{background:var(--canvas);border-radius:var(--rounded-lg);overflow:hidden;border:1px solid var(--hairline-soft);-webkit-overflow-scrolling:touch}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
thead th{background:var(--surface);color:var(--ink);padding:12px 14px;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--hairline);position:sticky;top:0;z-index:2}
tbody td{padding:11px 14px;font-size:14px;font-weight:400;border-bottom:1px solid var(--hairline-soft);color:var(--ink);line-height:1.4}
tbody tr:nth-child(even){background:var(--surface)}
.rank{font-weight:700;font-size:15px;text-align:center;width:44px;color:var(--steel)}
.rank-1{color:var(--sunshine-700)}
.rank-2{color:var(--steel)}
.rank-3{color:var(--primary)}
.product-link{color:var(--link);text-decoration:none;display:block;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.shop-name{font-size:12px;color:var(--stone);margin-top:2px;font-weight:400}
.unit-price{font-size:12px;color:var(--primary);margin-top:1px;font-weight:500}
.sales{font-weight:700;color:var(--ink);white-space:nowrap;font-size:14px}
.month-sales{color:var(--steel);white-space:nowrap;font-size:13px;font-weight:400}
.commission{color:var(--primary);font-weight:600;white-space:nowrap;font-size:13px}
.commission-high{color:var(--sunshine-700);font-weight:700}
.no-data{text-align:center;padding:60px;color:var(--muted);font-size:16px}

/* ── Sunset stripe band ── */
.sunset-stripe{background:linear-gradient(90deg,var(--primary) 0%,var(--sunshine-700) 25%,var(--sunshine-500) 50%,var(--yellow-saturated) 75%,var(--cream) 100%);height:4px;width:100%;margin-top:var(--spacing-section)}

/* ── Footer ── */
.footer{background:var(--surface);padding:var(--spacing-xxxl) var(--spacing-md);text-align:center;color:var(--slate);font-size:12px;font-weight:400;border-top:1px solid var(--hairline)}
.footer a{color:var(--link);text-decoration:none;font-weight:500}

@media(max-width:768px){
  .container{padding:0 var(--spacing-sm)}
  .hero-band{padding:var(--spacing-xxl) var(--spacing-sm) var(--spacing-xl)}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:var(--spacing-sm)}
  .stat-card{padding:var(--spacing-lg)}
  .charts-row{grid-template-columns:1fr}
  .chart-box canvas{max-height:200px}
  .date-nav button{padding:8px 14px;font-size:13px;min-height:40px}
  .date-nav input[type=date]{padding:8px 12px;font-size:13px;min-height:40px}
  .product-link{max-width:140px;font-size:13px}
  tbody td{padding:8px 8px;font-size:12px}
  thead th{padding:8px;font-size:10px}
  .table-scroll table{min-width:520px}
  .section-title{margin:var(--spacing-xl) 0 var(--spacing-md)}
}
@media(max-width:400px){
  .stats-row{grid-template-columns:repeat(2,1fr);gap:6px}
  .stat-card{padding:var(--spacing-sm)}
  .stat-card .value{font-size:20px}
  .date-nav button{padding:6px 10px;font-size:11px}
  .product-link{max-width:100px}
}
</style>
</head>
<body>

<div class="hero-band">
  <div class="container">
    <h1>抖音直播带货 · 爆款榜日报</h1>
    <div class="date" id="dateDisplay">--</div>
    <div class="sub">巨量百应 · 爆款榜（昨日 / 直播）</div>
  </div>
</div>

<div class="container">
  <div class="date-nav">
    <button onclick="changeDate(-1)" id="btnPrev">◀ 前一天</button>
    <span class="current-date" id="currentDate">--</span>
    <input type="date" id="datePicker" onchange="jumpToDate(this.value)">
    <button onclick="changeDate(1)" id="btnNext">后一天 ▶</button>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="value" id="totalSales">--</div><div class="label">昨日总销量</div></div>
    <div class="stat-card"><div class="value" id="avgCommission">--</div><div class="label">平均佣金率</div></div>
    <div class="stat-card"><div class="value" id="maxEarn">--</div><div class="label">最高佣金 / 单</div></div>
    <div class="stat-card"><div class="value" id="topProduct">--</div><div class="label">销量冠军</div></div>
  </div>

  <div class="charts-row">
    <div class="chart-box"><h3>Top 10 昨日销量</h3><canvas id="salesChart"></canvas></div>
    <div class="chart-box"><h3>佣金率对比</h3><canvas id="commissionChart"></canvas></div>
  </div>

  <h2 class="section-title">完整榜单 Top 20</h2>
  <div class="table-wrap">
    <div class="table-scroll">
      <table><thead><tr><th>排名</th><th>商品 / 店铺</th><th>昨日销量</th><th>月销量</th><th>佣金</th></tr></thead>
      <tbody id="tableBody"></tbody></table>
    </div>
  </div>
</div>

<div class="sunset-stripe"></div>
<div class="footer">
  点击商品名称跳转详情页 · 数据来源: 巨量百应<br>
  <a href="https://yh.yuze1.top">yh.yuze1.top</a>
</div>

<script>
var allDates={},availableDates=[],currentIndex=0,salesChart=null,commissionChart=null;
function parseSalesInt(s){return parseInt(String(s||'0').replace('万','0000'))||0}

function loadDateList(){
  fetch('data/all.json').then(function(r){return r.json()}).then(function(all){
    allDates=all;availableDates=Object.keys(all).sort();
    if(availableDates.length>0){currentIndex=availableDates.length-1;renderDate(availableDates[currentIndex])}
    updateNavButtons();
  }).catch(function(){
    document.getElementById('tableBody').innerHTML='<tr><td colspan="5" class="no-data">数据加载失败</td></tr>';
  });
}

function updateNavButtons(){
  document.getElementById('btnPrev').disabled=currentIndex<=0;
  document.getElementById('btnNext').disabled=currentIndex>=availableDates.length-1;
  if(availableDates.length>0)document.getElementById('datePicker').value=availableDates[currentIndex];
}

function changeDate(d){
  var i=currentIndex+d;
  if(i>=0&&i<availableDates.length){currentIndex=i;renderDate(availableDates[i]);updateNavButtons()}
}

function jumpToDate(s){
  var i=availableDates.indexOf(s);
  if(i>=0){currentIndex=i;renderDate(s);updateNavButtons()}else{alert('该日期暂无数据')}
}

function renderDate(dateStr){
  var rec=allDates[dateStr];if(!rec)return;
  var data=rec.products||[];
  document.getElementById('dateDisplay').textContent=rec.title||dateStr;
  document.getElementById('currentDate').textContent=dateStr;

  var ts=data.reduce(function(s,i){return s+parseSalesInt(i.sales)},0);
  var ar=(data.reduce(function(s,i){return s+(i.cos_ratio||0)},0)/Math.max(data.length,1)).toFixed(1);
  var me=(Math.max.apply(null,data.map(function(i){return(i.cos_fee||0)/100}))).toFixed(2);
  var tt=data.length>0?data[0].title.substring(0,12)+'...':'--';
  document.getElementById('totalSales').textContent=ts>=10000?Math.floor(ts/10000)+'万':String(ts);
  document.getElementById('avgCommission').textContent=ar+'%';
  document.getElementById('maxEarn').textContent='¥'+me;
  document.getElementById('topProduct').textContent=tt;

  var tb=document.getElementById('tableBody');tb.innerHTML='';
  data.forEach(function(item,i){
    var tr=document.createElement('tr');
    var rc=i<3?' rank-'+(i+1):'';
    var cc=(item.cos_ratio||0)>=20?' commission-high':'';
    var sn=parseSalesInt(item.sales);
    var sd=sn>=10000?Math.floor(sn/10000)+'万':String(sn);
    var ms=(item.month_sales||'').replace(/万.*/,'');
    var msd=ms?ms+'万':'';
    tr.innerHTML='<td class="rank'+rc+'">'+(i+1)+'</td><td><a class="product-link" href="'+item.detail_url+'" target="_blank">'+item.title+'</a><div class="shop-name">'+item.shop_name+'</div><div class="unit-price">客单价 ¥'+(item.unit_price||0).toFixed(2)+'</div></td><td class="sales">'+sd+'</td><td class="month-sales">'+msd+'</td><td class="commission'+cc+'">'+(item.commission||(item.cos_ratio+'%赚¥'+((item.cos_fee||0)/100).toFixed(2)))+'</td>';
    tb.appendChild(tr);
  });

  var t10=data.slice(0,10);
  if(salesChart)salesChart.destroy();
  if(commissionChart)commissionChart.destroy();

  salesChart=new Chart(document.getElementById('salesChart').getContext('2d'),{type:'bar',data:{labels:t10.map(function(_,i){return'#'+(i+1)}),datasets:[{data:t10.map(function(i){return parseSalesInt(i.sales)/10000}),backgroundColor:['#00bcd4','#00bcd4','#00bcd4','#0097a7','#0097a7','#0097a7','#4dd0e1','#4dd0e1','#4dd0e1','#4dd0e1'],borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#787898',callback:function(v){return v+'万'}}},x:{grid:{display:false},ticks:{color:'#787898'}}}}});

  commissionChart=new Chart(document.getElementById('commissionChart').getContext('2d'),{type:'line',data:{labels:t10.map(function(_,i){return'#'+(i+1)}),datasets:[{data:t10.map(function(i){return i.cos_ratio||0}),borderColor:'#00bcd4',backgroundColor:'rgba(0,188,212,0.1)',fill:true,tension:.4,pointBackgroundColor:'#00bcd4',pointRadius:4,pointHoverRadius:7,borderWidth:2}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#787898',callback:function(v){return v+'%'}}},x:{grid:{display:false},ticks:{color:'#787898'}}}}});
}

loadDateList();
</script>
</body>
</html>
